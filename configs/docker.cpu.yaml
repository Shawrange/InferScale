model:
  name: fake-model
  tokenizer_identity: fixture-v1
  template_identity: fixture-chat-v1
  context_limit: 4096
  default_output_tokens: 64
global_capacity: 8
tokenizer_mode: fixture
tokenizer_slots: 2
tokenizer_timeout_seconds: 5
routing:
  policy: round_robin
  prompt_weight: 1
  output_weight: 1
  queue_weight: 1
  cost_weight: 1
  cost_reference: 10000
  ewma_alpha: 0.2
  prefix_tokens: 32
  prefix_ttl_seconds: 300
  prefix_max_entries: 1024
  gamma: 0.25
health_interval_seconds: 1
health_timeout_seconds: 0.5
health_ttl_seconds: 3
max_body_bytes: 1048576
max_response_bytes: 4194304
max_event_bytes: 65536
max_prefetch_bytes: 131072
max_output_tokens: 2048
body_timeout_seconds: 5
connect_timeout_seconds: 2
pool_timeout_seconds: 1
first_output_timeout_seconds: 30
idle_timeout_seconds: 30
overall_timeout_seconds: 60
downstream_timeout_seconds: 5
cleanup_timeout_seconds: 1
workers:
  - worker_id: worker-0
    endpoint: http://worker-0:8100
    model: fake-model
    capacity: 4
  - worker_id: worker-1
    endpoint: http://worker-1:8101
    model: fake-model
    capacity: 4

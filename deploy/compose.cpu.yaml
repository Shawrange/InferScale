services:
  worker-0:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: inferscale:local
    command: ["/app/.venv/bin/python", "-m", "inferscale.testing.worker", "--host", "0.0.0.0", "--port", "8100", "--worker-id", "worker-0"]
    ports: ["127.0.0.1:8100:8100"]
  worker-1:
    image: inferscale:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["/app/.venv/bin/python", "-m", "inferscale.testing.worker", "--host", "0.0.0.0", "--port", "8101", "--worker-id", "worker-1"]
    ports: ["127.0.0.1:8101:8101"]
  gateway:
    image: inferscale:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["/app/.venv/bin/python", "-m", "inferscale.main", "--host", "0.0.0.0", "--config", "configs/docker.cpu.yaml"]
    ports: ["127.0.0.1:8000:8000"]
    depends_on: [worker-0, worker-1]

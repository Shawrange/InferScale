[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "inferscale"
version = "0.1.0"
description = "Replica routing experiments for LLM serving"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.139,<0.140",
  "httpx>=0.28,<0.29",
  "pydantic>=2.13,<3",
  "pyyaml>=6,<7",
  "uvicorn>=0.51,<0.52",
]

[dependency-groups]
dev = ["pytest>=9,<10", "pytest-asyncio>=1,<2", "ruff>=0.15,<1"]

[project.scripts]
inferscale = "inferscale.main:main"
inferscale-fake-worker = "inferscale.testing.worker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/inferscale"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
